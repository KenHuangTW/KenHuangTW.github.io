<h2 id="哎呀，您好像不該出現在這裡呢"><a href="#哎呀，您好像不該出現在這裡呢" class="headerlink" title="哎呀，您好像不該出現在這裡呢"></a>哎呀，您好像不該出現在這裡呢</h2><p>很抱歉，您好像到了一個未知的世界呢，這裡不是您該來的地方。</p>
<p>將會在 <span id="timeout">5</span> 秒後傳送您到您該去的地方。</p>
<p>或是你可以 <strong><a href="https://kenhuangtw.github.io/">點我返陽</a></strong> 返回陽間。</p>
<script>
let countTime = 5;

function count() {
  
  document.getElementById('timeout').textContent = countTime;
  countTime -= 1;
  if(countTime === 0){
    location.href = 'https://kenhuangtw.github.io/';
  }
  setTimeout(() => {
    count();
  }, 1000);
}

count();
</script>
